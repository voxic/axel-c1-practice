server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Hash routes (#/topics, #/quiz/mixed) never hit the server.
    # Fallback still covers a missing file or a direct /index.html request.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
